<ion-header>
  <ion-toolbar color="primary">
    <ion-title>MercadoVecino</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>Iniciar Sesión</h2>

  <ion-item>
    <ion-input placeholder="Correo">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input type="password" placeholder="Contraseña">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="login()">

    Iniciar sesión

  </ion-button>

</ion-content>
